<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Секретная страница</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px 14px 40px;
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive;
    background: linear-gradient(135deg, #ffd1e8, #ffe9a8, #c8f0ff, #e2d1ff);
    background-size: 400% 400%; animation: bg 12s ease infinite;
    text-align: center; color: #5a2a6e; overflow-x: hidden;
  }
  @keyframes bg { 0%,100% {background-position: 0 50%} 50% {background-position: 100% 50%} }
  h1 { font-size: clamp(26px, 6vw, 46px); margin: 10px 0 6px; text-shadow: 2px 2px #fff; }
  .sub { font-size: clamp(16px, 3.5vw, 22px); margin-bottom: 22px; }
  .buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; max-width: 760px; margin: 0 auto 24px; }
  button {
    font-family: inherit; font-size: 20px; padding: 16px 12px; border: 4px solid #fff;
    border-radius: 22px; color: #fff; cursor: pointer; font-weight: bold;
    box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .15s;
  }
  button:hover { transform: scale(1.1) rotate(-2deg); }
  button:active { transform: scale(.95) translateY(3px); }
  .b1 { background: #ff5fa2; } .b2 { background: #ff8a3d; }
  .b3 { background: #8a5cf6; } .b4 { background: #22b8cf; }
  #out {
    max-width: 560px; margin: 0 auto; background: rgba(255,255,255,.75);
    border-radius: 26px; padding: 18px; min-height: 120px; font-size: 22px;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
  }
  #out img { max-width: 100%; max-height: 320px; border-radius: 18px; border: 4px solid #fff; }
  .big { font-size: 90px; animation: bounce 1s infinite; }
  @keyframes bounce { 50% { transform: translateY(-14px); } }
  .diag { font-size: 26px; font-weight: bold; color: #d6246e; margin: 12px 0; }
  .opt { display: block; width: 100%; margin: 8px 0; background: #a06cff; font-size: 18px; }
  #talk { margin-top: 16px; font-size: 26px; font-weight: bold; color: #e0245e; opacity: 0; transition: opacity .6s; }
  #talk.show { opacity: 1; animation: bounce 1s 3; }
  .fly { position: fixed; top: -60px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
  #final { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: rgba(255,182,220,.92); font-size: clamp(28px, 7vw, 54px); font-weight: bold; padding: 20px; }
</style>
</head>
<body>
 
<h1>Секретная страница для поднятия настроения 😽</h1>
<div class="sub">Нажми на любую кнопку, чтобы получить дозу котиков</div>
 
<div class="buttons">
  <button class="b1" onclick="diagnose()">🩺 Поставить диагноз</button>
  <button class="b2" onclick="panic()">🚨 Кнопка паники</button>
  <button class="b3" onclick="startQuiz()">🔮 Пройти тест</button>
  <button class="b4" onclick="meme()">😹 Смешной мем</button>
</div>
 
<div id="out">Тут скоро случится что-то очень мурчащее... 🐾</div>
<div id="talk">Дома поговорим 😉</div>
<div id="final"></div>
 
<!-- Музыка: положи рядом файл nyan.mp3. Если его нет — заиграет встроенная весёлая мелодия. -->
<audio id="music" src="nyan.mp3" loop preload="auto"></audio>
 
<script>
// ---------- Картинки (если ссылка умерла — берём случайного кота с cataas, потом эмодзи) ----------
const MEMES = [
  "https://i.imgur.com/3Q5Z5Q5.jpg", // кот в шапочке
  "https://i.imgur.com/8Q5Z5Q5.jpg", // кот с большими глазами
  "https://i.imgur.com/2Q5Z5Q5.jpg", // кот смеётся
  "https://i.imgur.com/9Q5Z5Q5.jpg"  // кот спит
];
function catImg(url) {
  const img = new Image();
  img.alt = "котик";
  img.onerror = function () {
    img.onerror = function () { img.replaceWith(Object.assign(document.createElement("div"), { className: "big", textContent: "🐱" })); };
    img.src = "https://cataas.com/cat?t=" + Date.now();
  };
  img.src = url;
  return img;
}
const rnd = a => a[Math.floor(Math.random() * a.length)];
const out = document.getElementById("out");
const talkEl = document.getElementById("talk");
function talk() { talkEl.classList.remove("show"); void talkEl.offsetWidth; talkEl.classList.add("show"); }
function clearTalk() { talkEl.classList.remove("show"); }
 
// ---------- 1. Диагноз ----------
const DIAGNOSES = [
  "Слишком милая 🥺", "Острая нехватка обнимашек 🫂", "Синдром хорошего вкуса ✨",
  "Хроническая любовь к котикам 🐈", "Переизбыток очарования (опасно для окружающих)",
  "Требуется плед, чай и сериальчик 🍵", "Дефицит мурчания — срочно лечить!",
  "Подозрение на приступ обаяния"
];
function diagnose() {
  clearTalk(); out.innerHTML = "";
  out.append(catImg(MEMES[0]));
  const d = document.createElement("div");
  d.className = "diag";
  d.textContent = "Диагноз: " + rnd(DIAGNOSES);
  const r = document.createElement("div");
  r.textContent = "Рецепт: 3 обнимашки, 2 котика, 1 тёплый плед 💊";
  out.append(d, r);
  setTimeout(talk, 600);
}
 
// ---------- 2. Кнопка паники ----------
const music = document.getElementById("music");
let ctx, beepTimer, panicTimers = [];
const NOTES = [659,784,659,523,587,659,784,880,784,659,587,523]; // простая весёлая мелодия
function fallbackTune() {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    let i = 0;
    beepTimer = setInterval(() => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = NOTES[i++ % NOTES.length];
      g.gain.value = 0.05; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.14);
    }, 170);
  } catch (e) {}
}
function startMusic() {
  music.currentTime = 0;
  const p = music.play();
  if (p && p.catch) p.catch(fallbackTune);
  music.onerror = fallbackTune;
}
function stopMusic() { music.pause(); clearInterval(beepTimer); }
 
function panic() {
  clearTalk(); startMusic();
  const emo = ["🐱","😹","😻","🐈","🐾","😽","🐈‍⬛","🌈"];
  const spawn = setInterval(() => {
    const s = document.createElement("span");
    s.className = "fly"; s.textContent = rnd(emo);
    s.style.left = Math.random() * 95 + "vw";
    s.style.fontSize = 30 + Math.random() * 50 + "px";
    s.style.animationDuration = 2 + Math.random() * 2.5 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }, 60);
  setTimeout(() => {
    clearInterval(spawn); stopMusic();
    const f = document.getElementById("final");
    f.innerHTML = "Ну как ты там? Выздоравливай 💗<br>🐱";
    f.style.display = "flex";
    setTimeout(talk, 100);
    f.onclick = () => { f.style.display = "none"; };
    setTimeout(() => { f.style.display = "none"; }, 6000);
  }, 5000);
}
 
// ---------- 3. Тест ----------
const QUIZ = [
  { q: "Что ты чувствуешь?", a: ["Хочу спать 😴", "Хочу обниматься 🥺", "Хочу веселья 🤪", "Хочу всё и сразу 🌪️"] },
  { q: "Что хочешь съесть?", a: ["Зефирку 🍡", "Что-нибудь горячее 🍜", "Шоколадку 🍫", "Всё, что найду в холодильнике 🧀"] },
  { q: "Какое кино посмотрим?", a: ["Мультики 🎬", "Уютную мелодраму 💕", "Комедию 😂", "Про котиков, конечно 🐈"] },
  { q: "Как поднять настроение?", a: ["Пледик и чай 🫖", "Обнимашки 🤗", "Мемы 📱", "Мурчание рядом 😽"] }
];
const RESULTS = [
  "Ты сегодня — Зефирный мишка 🐻. Тебе нужно обниматься и смотреть мультики!",
  "Ты сегодня — Тёплый пледик 🧣. Тебе нужны чай, покой и мурлыканье!",
  "Ты сегодня — Хаос-котик 🙀. Тебе срочно нужны мемы и печеньки!",
  "Ты сегодня — Королева диванных котиков 👑. Всем мурчать, тебя лечим любовью!"
];
let qi = 0, score = [0,0,0,0];
function startQuiz() { clearTalk(); qi = 0; score = [0,0,0,0]; showQ(); }
function showQ() {
  const q = QUIZ[qi];
  out.innerHTML = "<b>" + q.q + "</b>";
  q.a.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = t;
    b.onclick = () => { score[i]++; qi++; qi < QUIZ.length ? showQ() : showResult(); };
    out.appendChild(b);
  });
}
function showResult() {
  out.innerHTML = "";
  out.append(catImg(rnd(MEMES)));
  const d = document.createElement("div");
  d.className = "diag"; d.textContent = RESULTS[score.indexOf(Math.max(...score))];
  out.append(d);
  setTimeout(talk, 500);
}
 
// ---------- 4. Мем ----------
function meme() {
  clearTalk(); out.innerHTML = "";
  out.append(catImg(rnd(MEMES)));
  const c = document.createElement("div");
  c.textContent = rnd(["Это ты, когда сказали «лечись» 😹", "Кот одобряет твоё выздоровление 👍", "Мур-мур-терапия активирована 🐾", "Когда наконец-то можно лежать весь день 😴"]);
  out.append(c);
  setTimeout(talk, 500);
}
</script>
</body>
</html>
